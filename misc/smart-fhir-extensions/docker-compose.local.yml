name: smart-fhir-local

services:
  fhir:
    image: hapiproject/hapi:latest
    container_name: smart-fhir-hapi-local
    ports:
      - "8081:8080"
    environment:
      hapi.fhir.cors.enabled: "true"
      hapi.fhir.cors.allowed_origin: "*"

  keycloak:
    build:
      context: ../..
      dockerfile: misc/smart-fhir-extensions/Dockerfile
      args:
        KEYCLOAK_IMAGE: quay.io/keycloak/keycloak:latest
    container_name: smart-keycloak-local
    depends_on:
      - fhir
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      SMART_REALM: smart
      FHIR_BASE_URL: http://localhost:8081/fhir
      INTERNAL_FHIR_URL: http://fhir:8080/fhir
      SMART_CLIENT_ID: smart-launch-client
      SMART_CLIENT_REDIRECT_URI: http://localhost:3000/*
    command:
      - start-dev
      - --import-realm